server:
  port: 8080

spring:
  application:
    name: digital-library
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/digital_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Hira2006@}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  library:
    due-days: 14
    fine-per-day: 5

logging:
  level:
    org.springframework.security: INFO
