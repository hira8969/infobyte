services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: digital_library
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: .
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/digital_library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-secret-change-this-secret-change-this-secret
    ports:
      - "8080:8080"

volumes:
  mysql-data:
